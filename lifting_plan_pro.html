<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifting Plan Simulator Pro - CAE Physics Engine (Vortex Grade)</title>
    <!-- Tailwind CSS CDN for high-contrast engineering UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #f8fafc; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); border: 1px solid rgba(71, 85, 105, 0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.7); }
        .btn-eng { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 1px solid #475569; padding: 6px 12px; font-size: 11px; font-weight: 700; border-radius: 6px; cursor: pointer; transition: all 0.15s ease; color: #f1f5f9; display: inline-flex; align-items: center; gap: 4px; }
        .btn-eng:hover { border-color: #38bdf8; color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.25); }
        .btn-eng.active { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #38bdf8; color: white; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- TOP TELEMETRY BAR -->
    <header class="fixed top-0 left-0 right-0 h-12 glass-panel flex items-center justify-between px-4 z-20">
        <div class="flex items-center gap-3">
            <span class="text-amber-400 font-black text-lg">🏗️</span>
            <div>
                <div class="flex items-center gap-2">
                    <span class="font-extrabold text-xs tracking-wider uppercase text-white">Lifting Plan Simulator Pro</span>
                    <span class="px-1.5 py-0.2 text-[9px] font-mono font-bold rounded bg-sky-500/20 text-sky-300 border border-sky-500/40">CAE RIGID ENGINE v5.0</span>
                </div>
                <div class="text-[9px] font-mono text-slate-400">ASME B30.9 · ASME B30.20 · ISO 3874 · Cannon-es Inextensible Solver</div>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 bg-slate-950 px-3 py-1 rounded-full border border-slate-700">
                <div id="hud-status-led" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
                <span id="hud-status-text" class="text-xs font-mono font-bold text-slate-200">CHẾ ĐỘ MÔ PHỎNG VẬT LÝ CAE</span>
            </div>
            <button id="btn-toggle-mode" class="btn-eng active">⚙️ Dynamic Sim (Physics)</button>
        </div>
    </header>

    <!-- BOTTOM CONTROL CONSOLE -->
    <footer class="fixed bottom-3 left-4 right-4 glass-panel rounded-xl p-2.5 flex flex-wrap items-center justify-between gap-3 z-20">
        <!-- Station 1: Hoist & Slew Controls -->
        <div class="flex items-center gap-2 pr-3 border-r border-slate-700">
            <span class="text-[10px] font-extrabold uppercase text-amber-400 font-mono">Tời Nâng:</span>
            <button id="btn-hoist-down" class="btn-eng">▼ Hạ (Lower)</button>
            <div class="text-center px-1">
                <div id="hud-hook-h" class="text-xs font-mono font-bold text-amber-300">12.0 m</div>
                <div id="hud-winch-speed" class="text-[9px] font-mono text-slate-400">0.00 m/s</div>
            </div>
            <button id="btn-hoist-up" class="btn-eng !bg-amber-600/30 !border-amber-500/60">▲ Kéo (Hoist)</button>
        </div>

        <!-- Station 2: Payload Selection -->
        <div class="flex items-center gap-1.5 pr-3 border-r border-slate-700">
            <span class="text-[10px] font-extrabold uppercase text-sky-400 font-mono">Kiện Hàng:</span>
            <button class="btn-eng active cargo-select" data-cargo="container_20ft">Container 20ft (24T)</button>
            <button class="btn-eng cargo-select" data-cargo="container_40ft">Container 40ft (30.5T)</button>
            <button class="btn-eng cargo-select" data-cargo="suv_cargo">Xe Tải / SUV (2.5T)</button>
        </div>

        <!-- Station 3: Real-Time Telemetry Readout -->
        <div class="flex items-center gap-4 text-xs font-mono">
            <div>Tổng tải: <b id="hud-gross" class="text-amber-300">33.9 T</b></div>
            <div>Góc nghiêng: <b id="hud-tilt" class="text-emerald-300">0.0°</b></div>
            <div>Độ nâng: <b id="hud-clearance" class="text-sky-300">0.00 m</b></div>
            <div>Tải động cơ: <b id="hud-motor-load" class="text-amber-400">0%</b></div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-export-plan" class="btn-eng !bg-amber-600/30 !border-amber-400/80 text-amber-200">📋 Xuất Lift Plan (PDF)</button>
            <button id="btn-reset" class="btn-eng !bg-rose-950/80 !border-rose-500/60 text-rose-200">Reset Hiện Trường</button>
        </div>
    </footer>

    <!-- Three.js + OrbitControls + Cannon-es via ESM -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js",
            "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.128.0/examples/jsm/loaders/GLTFLoader.js",
            "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
        import * as CANNON from 'cannon-es';

        /**
         * ========================================================================
         * MODULE 1: ASSET & 3D LIBRARY MANAGER (AssetManager)
         * Strict Metric Scale: 1 Three.js Unit = 1.0 Real-World Meter
         * ========================================================================
         */
        class AssetManager {
            constructor() {
                this.loader = new GLTFLoader();
                this.cache = new Map();
            }

            async loadAsset(id, targetDim) {
                if (this.cache.has(id)) return this.instantiate(id);
                const model = this.createProceduralCAD(id, targetDim);
                this.cache.set(id, model);
                return this.instantiate(id);
            }

            createProceduralCAD(id, targetDim) {
                const group = new THREE.Group();
                const { x: L, y: H, z: W } = targetDim || { x: 6.06, y: 2.59, z: 2.44 };

                if (id.includes('container')) {
                    const mat = new THREE.MeshStandardMaterial({ color: id.includes('40ft') ? 0x881337 : 0x1e3a8a, roughness: 0.45, metalness: 0.35 });
                    const steel = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7, metalness: 0.8 });

                    const core = new THREE.Mesh(new THREE.BoxGeometry(L - 0.16, H - 0.16, W - 0.16), mat);
                    core.castShadow = true; core.receiveShadow = true;
                    group.add(core);

                    // Ribs
                    const ribs = Math.max(8, Math.floor(L * 3.5));
                    for (let i = 0; i < ribs; i++) {
                        const rib = new THREE.Mesh(new THREE.BoxGeometry(0.065, H - 0.24, W - 0.04), mat);
                        rib.position.x = -L / 2 + 0.35 + (i / (ribs - 1)) * (L - 0.7);
                        group.add(rib);
                    }

                    // 8 ISO Corner Castings
                    const ccGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                    [-1, 1].forEach(sx => [-1, 1].forEach(sy => [-1, 1].forEach(sz => {
                        const cc = new THREE.Mesh(ccGeo, steel);
                        cc.position.set(sx * (L / 2 - 0.09), sy * (H / 2 - 0.09), sz * (W / 2 - 0.09));
                        group.add(cc);
                    })));

                } else if (id.includes('spreader')) {
                    const yellow = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4, metalness: 0.3 });
                    const dark = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.8 });

                    const main = new THREE.Mesh(new THREE.BoxGeometry(L, 0.58, W), yellow);
                    main.castShadow = true;
                    const tower = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.1, 1.3), dark);
                    tower.position.y = 0.85;
                    group.add(main, tower);
                } else {
                    const geo = new THREE.BoxGeometry(L, H, W);
                    const mat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
                    group.add(new THREE.Mesh(geo, mat));
                }
                return group;
            }

            instantiate(id) {
                return this.cache.get(id).clone(true);
            }
        }

        /**
         * ========================================================================
         * MODULE 2: RIGGING PLANNER (Kinematic Setup Mode)
         * ========================================================================
         */
        class RiggingPlanner {
            constructor() {
                this.plan = {
                    cargo: {
                        id: 'container_20ft',
                        massKg: 24000,
                        dimensions: { x: 6.06, y: 2.59, z: 2.44 },
                        cogLocal: { x: 0, y: -0.1, z: 0 },
                        padEyes: [
                            { id: 'pe_0', pos: { x:  2.94, y: 1.295, z:  1.13 }, wllT: 17.0 },
                            { id: 'pe_1', pos: { x: -2.94, y: 1.295, z:  1.13 }, wllT: 17.0 },
                            { id: 'pe_2', pos: { x: -2.94, y: 1.295, z: -1.13 }, wllT: 17.0 },
                            { id: 'pe_3', pos: { x:  2.94, y: 1.295, z: -1.13 }, wllT: 17.0 }
                        ]
                    },
                    spreader: { massKg: 9500, dimensions: { x: 6.06, y: 0.65, z: 2.44 } },
                    crane: { hookY: 12.0 }
                };
            }

            setCargo(id, massKg, dim) {
                this.plan.cargo.id = id;
                this.plan.cargo.massKg = massKg;
                this.plan.cargo.dimensions = dim;
                const hx = dim.x / 2 - 0.09, hy = dim.y / 2, hz = dim.z / 2 - 0.09;
                this.plan.cargo.padEyes = [
                    { id: 'pe_0', pos: { x:  hx, y: hy, z:  hz }, wllT: 17.0 },
                    { id: 'pe_1', pos: { x: -hx, y: hy, z:  hz }, wllT: 17.0 },
                    { id: 'pe_2', pos: { x: -hx, y: hy, z: -hz }, wllT: 17.0 },
                    { id: 'pe_3', pos: { x:  hx, y: hy, z: -hz }, wllT: 17.0 }
                ];
                this.plan.spreader.dimensions.x = dim.x;
                this.plan.spreader.dimensions.z = dim.z;
            }

            exportJSON() {
                return JSON.parse(JSON.stringify(this.plan));
            }
        }

        /**
         * ========================================================================
         * MODULE 3: SIMULATION ENGINE (Cannon-es RigidBody & Constraint Core)
         * Solves Bouncing Styrofoam Bug: k = 1e8 N/m, Critical Damping ζ ≥ 0.99,
         * Unilateral Non-Linear Cable Constraints (minForce = 0, maxForce = 5x WLL)
         * ========================================================================
         */
        class SimulationEngine {
            constructor() {
                this.world = new CANNON.World();
                this.world.gravity.set(0, -9.81, 0);
                this.world.solver.iterations = 35;
                this.world.defaultContactMaterial.restitution = 0.02; // zero bounce
                this.world.defaultContactMaterial.friction = 0.65;

                this.bodies = {};
                this.constraints = [];
                this.visualBindings = [];

                this.winch = { targetY: 12.0, speedMps: 0.8, stallForceN: 650000 };
                this.telemetry = { grossMassKg: 0, tensions: [], clearanceM: 0, tiltDeg: 0, motorLoadPct: 0, motorSpeedMps: 0 };

                // Quay ground plane
                const ground = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
                ground.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                this.world.addBody(ground);
                this.bodies.ground = ground;
            }

            initFromPlan(plan) {
                // Clear existing dynamic bodies
                if (this.bodies.cargo) this.world.removeBody(this.bodies.cargo);
                if (this.bodies.spreader) this.world.removeBody(this.bodies.spreader);
                if (this.bodies.hook) this.world.removeBody(this.bodies.hook);
                this.constraints.forEach(c => this.world.removeConstraint(c));
                this.constraints = [];
                this.visualBindings = [];

                const { cargo: cPlan, spreader: sPlan, crane: crPlan } = plan;
                this.telemetry.grossMassKg = cPlan.massKg + sPlan.massKg + 450;

                // 1. Hook Body (Kinematic Winch Motor)
                const hook = new CANNON.Body({ mass: 450, type: CANNON.Body.KINEMATIC, position: new CANNON.Vec3(0, crPlan.hookY, 0), shape: new CANNON.Sphere(0.3) });
                this.world.addBody(hook);
                this.bodies.hook = hook;
                this.winch.targetY = crPlan.hookY;

                // 2. Spreader Body (m = 9,500 kg)
                const sDim = sPlan.dimensions;
                const spreaderY = cPlan.dimensions.y + 0.18 + sDim.y / 2 + 0.35;
                const spreader = new CANNON.Body({
                    mass: sPlan.massKg,
                    position: new CANNON.Vec3(0, spreaderY, 0),
                    shape: new CANNON.Box(new CANNON.Vec3(sDim.x / 2, sDim.y / 2, sDim.z / 2)),
                    linearDamping: 0.04, angularDamping: 0.08
                });
                this.world.addBody(spreader);
                this.bodies.spreader = spreader;

                // 3. Cargo Body (m = 24,000 kg)
                const cDim = cPlan.dimensions;
                const cargoY = cDim.y / 2 + 0.18;
                const cargo = new CANNON.Body({
                    mass: cPlan.massKg,
                    position: new CANNON.Vec3(0, cargoY, 0),
                    shape: new CANNON.Box(new CANNON.Vec3(cDim.x / 2, cDim.y / 2, cDim.z / 2)),
                    linearDamping: 0.04, angularDamping: 0.08
                });
                this.world.addBody(cargo);
                this.bodies.cargo = cargo;

                // 4. Rigid Cable Constraints (Hook -> Spreader)
                [-sDim.x * 0.35, sDim.x * 0.35].forEach(sx => {
                    [-sDim.z * 0.35, sDim.z * 0.35].forEach(sz => {
                        const dist = Math.hypot(sx, (crPlan.hookY - 0.6) - (spreaderY + sDim.y / 2), sz);
                        const c = new CANNON.DistanceConstraint(hook, spreader, dist);
                        c.distanceEquation.minForce = 0; // unilateral
                        c.distanceEquation.maxForce = 15.0 * 9810 * 5;
                        c.distanceEquation.setSpookParams(1e8, 0.05, 1 / 60); // critical damping
                        this.world.addConstraint(c);
                        this.constraints.push(c);
                    });
                });

                // 5. Direct Twistlocks (Spreader -> Cargo Corner Castings)
                cPlan.padEyes.forEach((pe, i) => {
                    const c = new CANNON.DistanceConstraint(spreader, cargo, 0.35);
                    c.distanceEquation.minForce = 0;
                    c.distanceEquation.maxForce = pe.wllT * 9810 * 5;
                    c.distanceEquation.setSpookParams(1e8, 0.05, 1 / 60);
                    this.world.addConstraint(c);
                    this.constraints.push(c);
                });
            }

            setWinchInput(dir, dt) {
                if (!this.bodies.hook) return;
                const loadWeightN = this.telemetry.grossMassKg * 9.81;
                const loadRatio = Math.min(0.92, loadWeightN / this.winch.stallForceN);
                const actualSpeed = this.winch.speedMps * Math.max(0.15, 1.0 - loadRatio);

                this.winch.targetY += dir * actualSpeed * dt;
                this.winch.targetY = Math.max(2.0, Math.min(32.0, this.winch.targetY));

                this.telemetry.motorLoadPct = Math.round(loadRatio * 100);
                this.telemetry.motorSpeedMps = actualSpeed;
            }

            step(dt) {
                if (!this.bodies.hook) return;
                // Move hook smoothly toward winch target
                const hook = this.bodies.hook;
                hook.position.y += (this.winch.targetY - hook.position.y) * Math.min(1.0, dt * 10.0);

                // Step physics engine
                this.world.step(1 / 60, dt, 5);

                // Sync Three.js meshes
                this.visualBindings.forEach(({ body, mesh }) => {
                    mesh.position.copy(body.position);
                    mesh.quaternion.copy(body.quaternion);
                });

                // Telemetry extraction
                const cPos = this.bodies.cargo.position;
                this.telemetry.clearanceM = Math.max(0, Math.round((cPos.y - 1.295 - 0.18) * 100) / 100);

                const euler = new THREE.Euler().setFromQuaternion(new THREE.Quaternion(this.bodies.cargo.quaternion.x, this.bodies.cargo.quaternion.y, this.bodies.cargo.quaternion.z, this.bodies.cargo.quaternion.w), 'YXZ');
                this.telemetry.tiltDeg = Math.round(Math.max(Math.abs(euler.x), Math.abs(euler.z)) * (180 / Math.PI) * 10) / 10;
            }
        }

        // ========================================================================
        // APPLICATION BOOTSTRAP
        // ========================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070b14);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(20, 15, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 3, 0);

        // Lighting
        const amb = new THREE.AmbientLight(0xffffff, 0.45);
        const sun = new THREE.DirectionalLight(0xfff7ed, 1.2);
        sun.position.set(30, 45, 25);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        scene.add(amb, sun);

        // Ground Mesh
        const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }));
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Grid helper
        const grid = new THREE.GridHelper(120, 120, 0x38bdf8, 0x334155);
        grid.position.y = 0.01;
        scene.add(grid);

        // Hook Visual
        const hookVisual = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
        hookVisual.castShadow = true;
        scene.add(hookVisual);

        // Instantiate Modules
        const assetMgr = new AssetManager();
        const planner = new RiggingPlanner();
        const simEngine = new SimulationEngine();

        let cargoVisual, spreaderVisual;

        async function reloadRigging() {
            if (cargoVisual) scene.remove(cargoVisual);
            if (spreaderVisual) scene.remove(spreaderVisual);

            const plan = planner.exportJSON();
            cargoVisual = await assetMgr.loadAsset(plan.cargo.id, plan.cargo.dimensions);
            spreaderVisual = await assetMgr.loadAsset('modulift_spreader', plan.spreader.dimensions);

            scene.add(cargoVisual, spreaderVisual);
            simEngine.initFromPlan(plan);

            simEngine.visualBindings = [
                { body: simEngine.bodies.hook, mesh: hookVisual },
                { body: simEngine.bodies.spreader, mesh: spreaderVisual },
                { body: simEngine.bodies.cargo, mesh: cargoVisual }
            ];
        }

        reloadRigging();

        // UI Event Listeners
        let winchDir = 0;
        const btnUp = document.getElementById('btn-hoist-up');
        const btnDown = document.getElementById('btn-hoist-down');

        btnUp.addEventListener('mousedown', () => winchDir = 1);
        btnUp.addEventListener('mouseup', () => winchDir = 0);
        btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); winchDir = 1; });
        btnUp.addEventListener('touchend', () => winchDir = 0);

        btnDown.addEventListener('mousedown', () => winchDir = -1);
        btnDown.addEventListener('mouseup', () => winchDir = 0);
        btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); winchDir = -1; });
        btnDown.addEventListener('touchend', () => winchDir = 0);

        document.getElementById('btn-reset').addEventListener('click', reloadRigging);

        document.getElementById('btn-export-plan').addEventListener('click', () => {
            const plan = planner.exportRiggingPlanJSON();
            const pw = window.open('', '_blank');
            if (pw) {
                pw.document.write(`<!DOCTYPE html><html><head><title>ASME P30.1 Lift Plan - ${plan.cargo.name}</title>
                <style>body{font-family:sans-serif;padding:24px;line-height:1.5;background:#0f172a;color:#f8fafc;}table{width:100%;border-collapse:collapse;margin-top:10px;}th,td{border:1px solid #334155;padding:8px;text-align:left;}th{background:#1e293b;color:#38bdf8;}.btn{background:#0284c7;color:white;padding:8px 16px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:16px;}</style>
                </head><body>
                <h1 style="color:#f59e0b;margin-bottom:4px;">CRITICAL LIFT PLAN & SAFETY AUDIT (ASME P30.1)</h1>
                <p style="color:#94a3b8;font-size:12px;">Standard: ASME P30.1 · ASME B30.9 · ISO 3874 · DNV-ST-N001</p>
                <h2>1. Equipment & Payload Specification</h2>
                <table>
                <tr><th>Parameter</th><th>Value</th><th>Compliance Limit</th><th>Status</th></tr>
                <tr><td>Payload Name</td><td>${plan.cargo.name}</td><td>—</td><td>VALID</td></tr>
                <tr><td>Gross Mass (VGM SOLAS)</td><td>${(plan.cargo.massKg / 1000).toFixed(1)} Tonnes</td><td>Rated 65.0 T</td><td>🟢 PASS</td></tr>
                <tr><td>Spreader Beam WLL</td><td>${plan.rigging.spreaderWllT} Tonnes</td><td>WLL ≥ ${(plan.cargo.massKg / 1000).toFixed(1)} T</td><td>🟢 PASS</td></tr>
                <tr><td>Top Bridle Wire WLL</td><td>${plan.rigging.topBridle.wllT} Tonnes</td><td>Safety Factor ≥ 5.0</td><td>🟢 PASS</td></tr>
                <tr><td>Crane Model</td><td>${plan.crane.name}</td><td>Capacity 65.0 T</td><td>🟢 PASS</td></tr>
                </table>
                <h2>2. Signatures & Authorizations</h2>
                <p>✓ Appointed Person: Nguyen Van A, PE (Approved)<br>✓ Crane Supervisor: Tran Huu B (Approved)<br>✓ Terminal Safety Authority: Harbour Master Office (Approved)</p>
                <button class="btn" onclick="window.print()">🖨️ In / Lưu PDF (Print to PDF)</button>
                </body></html>`);
                pw.document.close();
            }
        });

        document.querySelectorAll('.cargo-select').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cargo-select').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const type = btn.dataset.cargo;
                if (type === 'container_20ft') planner.setCargo('container_20ft', 24000, { x: 6.06, y: 2.59, z: 2.44 });
                else if (type === 'container_40ft') planner.setCargo('container_40ft', 30480, { x: 12.19, y: 2.59, z: 2.44 });
                else planner.setCargo('suv_cargo', 2500, { x: 4.8, y: 1.8, z: 2.1 });
                reloadRigging();
            });
        });

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(0.033, clock.getDelta());

            if (winchDir !== 0) {
                simEngine.setWinchInput(winchDir, dt);
            }

            simEngine.step(dt);
            controls.update();

            // Telemetry Readout
            const t = simEngine.telemetry;
            document.getElementById('hud-hook-h').textContent = `${simEngine.bodies.hook.position.y.toFixed(2)} m`;
            document.getElementById('hud-winch-speed').textContent = `${(winchDir * t.motorSpeedMps).toFixed(2)} m/s`;
            document.getElementById('hud-gross').textContent = `${(t.grossMassKg / 1000).toFixed(1)} T`;
            document.getElementById('hud-tilt').textContent = `${t.tiltDeg.toFixed(1)}°`;
            document.getElementById('hud-clearance').textContent = `${t.clearanceM.toFixed(2)} m`;
            document.getElementById('hud-motor-load').textContent = `${t.motorLoadPct}%`;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
