name: SafeLift3D CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safelift3d-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Architecture, tests, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check architecture boundaries
        run: npm run architecture:gate

      - name: Run unit and regression tests
        run: npm test

      - name: Test Firestore Security Rules in Emulator
        run: npx --yes firebase-tools@15.12.0 emulators:exec --only firestore --project safelift3d-rules-test "node --test test/firestore-rules-emulator.mjs"

      - name: Build Cloudflare Pages output
        run: npm run build
