name: CI

on:
  push:
    branches: [main, master, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Architecture gate — god-file shims stay thin
        run: node scripts/architecture-gate.mjs
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
