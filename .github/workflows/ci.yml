name: SafeLift3D CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safelift3d-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan repository history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  verify:
    name: Architecture, tests, and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit high and critical dependencies
        run: npm audit --audit-level=high

      - name: Set up Java for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check architecture boundaries
        run: npm run architecture:gate

      - name: Run unit and regression tests
        run: npm test

      - name: Test Firestore Security Rules in Emulator
        run: npx --yes firebase-tools@15.12.0 emulators:exec --only firestore --project safelift3d-rules-test "node --test test/firestore-rules-emulator.mjs"

      - name: Build Cloudflare Pages output
        run: npm run build

      - name: Verify build output contains no sourcemaps
        run: npm run check:dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run SaaS accessibility E2E tests
        run: npx playwright test e2e/saas-accessibility.spec.js --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
